<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="system-ui, Segoe UI, sans-serif">
<defs>
  <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4fd1c5"/></marker>
  <style>
    .t{fill:#e6e9ef}.m{fill:#8b93a1;font-size:17px}.h{font-size:24px;font-weight:700}.b{font-size:21px;font-weight:600}
    .box{fill:#171b22;stroke:#2d3440;stroke-width:2;rx:14}.acc{stroke:#4fd1c5}.hl{fill:#4fd1c5}
    .l{stroke:#4fd1c5;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
</defs>
<rect width="1600" height="900" fill="#0e1116"/>
<text x="60" y="78" class="t" font-size="42" font-weight="800">Lens<tspan class="hl">Mate</tspan> · architecture</text>
<text x="60" y="114" class="m" font-size="21">A mixed-reality chatbot that runs entirely on a laptop: webcam passthrough, voice, a 3D companion, local models.</text>

<!-- INPUTS -->
<rect x="50" y="160" width="270" height="600" class="box"/>
<text x="76" y="204" class="t h">INPUTS</text>
<text x="76" y="262" class="t b">📷 Camera</text><text x="76" y="290" class="m">live frames</text>
<text x="76" y="352" class="t b">🎤 Voice</text><text x="76" y="380" class="m">hold to talk</text>
<text x="76" y="442" class="t b">⌨ Text</text><text x="76" y="470" class="m">chat + commands</text>
<text x="76" y="532" class="t b">👆 Click</text><text x="76" y="560" class="m">point at an object</text>
<text x="76" y="622" class="t b">🎬 Motion</text><text x="76" y="650" class="m">“what am I doing?”</text>
<text x="76" y="712" class="t b">🧠 Teaching</text><text x="76" y="740" class="m">“this is a …” + photo</text>

<!-- BROWSER -->
<rect x="400" y="160" width="780" height="600" class="box acc"/>
<text x="428" y="204" class="t h">BROWSER · Chrome / Firefox</text>
<g class="b">
<rect x="428" y="226" width="350" height="96" class="box"/><text x="446" y="262" class="t b">Camera view + overlay</text><text x="446" y="294" class="m">labels follow objects at ~20 fps</text>
<rect x="800" y="226" width="352" height="96" class="box"/><text x="818" y="262" class="t b">3D companion</text><text x="818" y="294" class="m">Three.js · reacts · points</text>
<rect x="428" y="342" width="350" height="96" class="box"/><text x="446" y="378" class="t b">Action analysis</text><text x="446" y="410" class="m">rolling buffer · motion measured</text>
<rect x="800" y="342" width="352" height="96" class="box"/><text x="818" y="378" class="t b">Voice in / out</text><text x="818" y="410" class="m">Web Speech / 🔒 offline mic · TTS</text>
<rect x="428" y="458" width="350" height="96" class="box"/><text x="446" y="494" class="t b">Memory</text><text x="446" y="526" class="m">taught photos + facts</text>
<rect x="800" y="458" width="352" height="96" class="box"/><text x="818" y="494" class="t b">Chat history</text><text x="818" y="526" class="m">new · switch · rename · export</text>
</g>
<text x="428" y="600" class="m">Stored in the browser: chats, taught objects, frame buffer (RAM only).</text>
<text x="428" y="632" class="m">Frames go to the server only when you ask something.</text>
<text x="428" y="690" class="t b">Modes</text><text x="520" y="690" class="m">Chat · Explain · Describe · Read / translate</text>
<text x="428" y="730" class="t b">Status</text><text x="520" y="730" class="m">service lights · suggestion chips · memory panel</text>

<!-- SERVER -->
<rect x="1260" y="160" width="290" height="280" class="box"/>
<text x="1286" y="204" class="t h">NODE SERVER</text>
<text x="1286" y="250" class="t b">/api/chat</text><text x="1286" y="278" class="m">streaming · modes · actions</text>
<text x="1286" y="320" class="t b">/api/detect</text><text x="1286" y="348" class="m">grounding → boxes</text>
<text x="1286" y="390" class="t b">/api/stt · /api/health</text><text x="1286" y="418" class="m">localhost only · 0 deps</text>

<!-- MODELS -->
<rect x="1260" y="500" width="290" height="260" class="box acc"/>
<text x="1286" y="544" class="t h">LOCAL MODELS</text>
<text x="1286" y="594" class="t b">Qwen2.5-VL 7B</text><text x="1286" y="622" class="m">Ollama · GPU · vision + chat</text>
<text x="1286" y="672" class="t b">faster-whisper</text><text x="1286" y="700" class="m">small.en · CPU · offline STT</text>
<text x="1286" y="736" class="m" font-size="16">photo checks: yes/no queries</text>

<path class="l" d="M320 460 H400"/>
<path class="l" d="M1180 330 H1260"/>
<path class="l" d="M1405 440 V500"/>

<rect x="50" y="800" width="1500" height="60" class="box"/>
<text x="76" y="838" class="t b">Measured:</text>
<text x="190" y="838" class="m" font-size="20">~1.2 s to first token · grounding IoU 0.96 · offline speech 0.8 s, 4% WER · actions 6/6 (synthetic) · taught-photo recognition 5–6/6 with 0 false claims</text>
</svg>

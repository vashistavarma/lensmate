<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LensMate</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --accent:#4fd1c5; --text:#e6e9ef; --muted:#8b93a1; }
  * { box-sizing: border-box; }
  html, body { overflow:hidden; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px system-ui,sans-serif;
         display:grid; grid-template-columns:1fr 380px; height:100vh; }
  #stage { position:relative; background:#000; display:flex; align-items:center; justify-content:center; }
  video { width:100%; height:100%; object-fit:fill; display:block; } /* 16:9 box matches the detect frame */
  #status { position:absolute; top:12px; left:12px; padding:4px 10px; border-radius:12px;
            background:#000a; color:var(--muted); font-size:12px; }
  #stage { container-type:size; }
  #wrap { position:relative; width:min(100cqw, 177.78cqh); aspect-ratio:16/9; }
  #avatar { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #wrap { cursor:crosshair; }
  .ping { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border:3px solid var(--accent); border-radius:50%; pointer-events:none; animation:ping 1.2s ease-out forwards; }
  @keyframes ping { from { transform:scale(.4); opacity:1; } to { transform:scale(1.6); opacity:0; } }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  aside { background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
  h1 { margin:0; padding:14px 16px; font-size:16px; border-bottom:1px solid #262c36; }
  h1 span { color:var(--accent); }
  #bar { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; padding:8px 12px; border-bottom:1px solid #262c36; }
  #bar select { flex:1; min-width:0; padding:7px; border-radius:8px; border:1px solid #2d3440; background:#0e1116; color:var(--text); }
  #bar button { padding:6px 10px; }
  #bar #facts { background:#24303a; color:var(--text); font-weight:500; font-size:12px; white-space:nowrap; }
  #health { font-size:12px; color:var(--muted); white-space:nowrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 3px 0 6px; background:#718096; }
  .dot.ok { background:#68d391; } .dot.bad { background:#f56565; }
  #chips { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px 0; }
  .chip { padding:5px 10px; border-radius:14px; background:#1f2630; color:var(--text); border:1px solid #2d3440; font-weight:500; font-size:12px; }
  .chip:hover { border-color:var(--accent); }
  #mem { max-height:38%; overflow-y:auto; padding:10px 16px; border-bottom:1px solid #262c36; background:#12161c; font-size:13px; }
  #mem[hidden] { display:none; }
  .memrow { display:flex; align-items:center; gap:10px; padding:4px 0; }
  .memrow img { width:64px; height:36px; object-fit:cover; border-radius:6px; }
  .memrow span { flex:1; } .memrow button { padding:2px 8px; background:#3a2626; color:#feb2b2; }
  .memhead { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:8px 0 2px; }
  #log { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:90%; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#24303a; }
  .bot { align-self:flex-start; background:#1d2a2a; border:1px solid #2a4a47; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #262c36; }
  input { flex:1; min-width:0; padding:10px; border-radius:8px; border:1px solid #2d3440; background:#0e1116; color:var(--text); }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#06201d; font-weight:600; cursor:pointer; }
  #mic.live { background:#f56565; }
  button:disabled { opacity:.5; cursor:wait; }
  @media (max-width:800px) { body { grid-template-columns:1fr; grid-template-rows:45vh 1fr; } }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><video id="cam" autoplay playsinline muted></video><canvas id="overlay"></canvas><canvas id="avatar"></canvas></div><div id="status">starting camera…</div></div>
<aside>
  <h1><span>Lens</span>Mate · mixed reality chat <span style="float:right;font-size:12px;color:var(--muted)"><label title="Record in the browser and transcribe on this computer (faster-whisper)"><input type="checkbox" id="offline" style="flex:none"> 🔒 offline mic</label> &nbsp; <label><input type="checkbox" id="speak" checked style="flex:none"> 🔊</label></span></h1>
  <div id="bar">
    <select id="mode" title="Response mode">
      <option value="chat">💬 Chat</option><option value="explain">🎓 Explain</option>
      <option value="describe">👁 Describe</option><option value="read">📖 Read / translate</option>
    </select>
    <button id="snap" type="button" title="Save the current frame as a JPEG (for the eval set)">📷</button>
    <button id="facts" type="button" title="What LensMate remembers (click to manage)">🧠</button>
    <span id="health" title="Service status"></span>
  </div>
  <div id="mem" hidden></div>
  <div id="log"></div>
  <div id="chips"></div>
  <form id="form">
    <input id="q" placeholder="Ask about what you see…" autocomplete="off" autofocus>
    <button id="scan" type="button" title="Label everything in view">🔍</button>
    <button id="mic" type="button" title="Hold to talk (or hold Space)">🎤</button>
    <button id="send">Ask</button>
  </form>
</aside>
<script src="app.js"></script>
<script src="voice.js"></script>
<script src="tracker.js"></script>
<script src="spatial.js"></script>
<script src="ui.js"></script>
<script type="module" src="avatar.js"></script>
</body>
</html>
